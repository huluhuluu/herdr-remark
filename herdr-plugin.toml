id = "huluhlu.agent-inform"
name = "Remark"
version = "0.3.0"
min_herdr_version = "0.8.2"
description = "Two shortcuts: read/unread and a short agent remark"
platforms = ["windows", "linux", "macos"]

[[startup]]
command = ["node", "src/remark.js", "init"]

[[actions]]
id = "toggle-unread"
title = "Toggle read / unread"
contexts = ["pane", "global"]
command = ["node", "src/remark.js", "toggle-unread"]

[[actions]]
id = "note"
title = "Edit remark"
contexts = ["pane", "global"]
command = ["node", "src/remark.js", "note"]

[[panes]]
id = "note-editor"
title = "Remark"
placement = "overlay"
command = ["node", "src/note-editor.js"]

[[events]]
on = "pane.focused"
command = ["node", "src/remark.js", "event"]

[[events]]
on = "pane.agent_detected"
command = ["node", "src/remark.js", "event"]
