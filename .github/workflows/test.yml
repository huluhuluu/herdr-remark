name: test

on:
  push:
    branches: [main]
  pull_request:

# The suite only reads the checkout, so the job needs nothing beyond that.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies or build step; the suite runs against the checkout.
      - run: npm test
